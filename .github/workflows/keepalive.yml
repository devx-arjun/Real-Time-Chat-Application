name: Keep Render Awake

on:
  schedule:
    # Runs every 14 minutes to prevent Render's 15-minute sleep
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows you to manually trigger it from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        # IMPORTANT: You must change the URL below to your actual Render backend URL once you deploy it!
        run: |
          echo "Pinging the server to keep it awake..."
          curl -s https://linkup-backend.onrender.com/health || echo "Ping failed"
