name: Keep Render Awake

on:
  schedule:
    # Run every 14 minutes
    - cron: "*/14 * * * *"

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render backend
        run: |
          echo "Pinging LinkUp backend..."
          curl --fail --silent --show-error \
            https://real-time-chat-application-backend-prlq.onrender.com/health

          echo "Render backend is responding."
